<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Enrollment Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="toast-container" class="toast-container" aria-live="polite"></div>
<section id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.6V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.4"/></svg>
      <h1 id="login-system-title">School Enrollment Management System</h1>
    </div>
    <form id="login-form" class="login-form" autocomplete="off">
      <label class="field"><span>Username</span><input type="text" id="login-username" name="username" required /></label>
      <label class="field"><span>Password</span><input type="password" id="login-password" name="password" required /></label>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn"><span class="btn-label">Login</span><span class="spinner" hidden></span></button>
      <p id="login-error" class="form-error" hidden></p>
    </form>
    <button class="link-btn" id="open-privacy-from-login" type="button">Privacy &amp; Cookie Policy</button>
  </div>
</section>
<div class="modal-overlay" id="modal-privacy" hidden><div class="modal modal-lg"><div class="modal-header"><h3>Privacy &amp; Cookie Policy</h3><button class="icon-btn modal-close" data-close="modal-privacy">X</button></div><div class="modal-body" id="privacy-modal-content"></div></div></div>
<script>window.IS_LOGIN_PAGE = true;</script><script src="script.js"></script>
</body>
</html>
